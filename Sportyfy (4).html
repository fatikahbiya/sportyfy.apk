<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Sportyfy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{--navy:#0B1437;--blue:#1E6BFF;--cyan:#19C3F0;--lime:#C6F432;--or:#FF6B2C;--vi:#7B4DFF;--bg:#F6F5F0;--w:#fff;--line:#E4E2DA;--mut:#6B7190;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme=light]){color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',Helvetica,sans-serif;background:#DCDAD0;color:var(--navy);display:flex;justify-content:center;align-items:center}
.phone{width:100%;max-width:390px}
.app{position:relative;width:100%;max-width:390px;height:min(844px,100dvh);min-height:min(844px,100dvh);background:var(--bg);overflow:hidden}
@media(min-width:500px){body{background:#E9E8E3}.app{border:1px solid #D4D2C8;box-shadow:0 20px 60px #0B143720}}
#v{height:100%;overflow-y:auto;padding-bottom:96px;animation:in .35s ease;scrollbar-width:none}
#v::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pad{padding:0 20px}
h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-1.2px}
h2{font-size:24px;line-height:1.1;font-weight:800;letter-spacing:-.6px}
h3{font-size:16px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:13px;color:var(--mut);font-weight:500}
.cap{font-size:12px;font-weight:500;color:var(--mut)}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}
i[data-lucide],svg.lucide{width:16px;height:16px;stroke-width:2.2}
.ph{position:relative;background:var(--g);overflow:hidden;transition:transform .5s}
.ph:before{content:"";position:absolute;width:140%;aspect-ratio:1;right:-45%;top:-30%;border-radius:50%;background:radial-gradient(circle,#ffffff33,#fff0 62%)}
.ph:after{content:attr(data-s);position:absolute;left:10px;bottom:6px;font-size:54px;font-weight:800;letter-spacing:-3px;color:#ffffff1f;line-height:1}
.skate{--g:linear-gradient(150deg,#FF6B2C,#7B4DFF)}.badminton{--g:linear-gradient(150deg,#19C3F0,#0B1437)}.basketball{--g:linear-gradient(150deg,#FF6B2C,#1b1f4d)}.futsal{--g:linear-gradient(150deg,#9ad81a,#0B1437)}.running{--g:linear-gradient(150deg,#7B4DFF,#1E6BFF)}.volleyball{--g:linear-gradient(150deg,#ffb12c,#FF6B2C)}.people{--g:linear-gradient(150deg,#1E6BFF,#7B4DFF)}
.card:active .ph,.tap:active{transform:scale(.97)}.card:active .ph{transform:scale(1.04)}
.tap{transition:transform .15s;cursor:pointer}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:var(--lime);color:var(--navy)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:16px;font:700 15px 'Plus Jakarta Sans';background:var(--lime);color:var(--navy);cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.dk{background:var(--navy);color:#fff}.btn.ol{background:transparent;border:1.5px solid var(--navy)}
.sm{padding:11px 16px;width:auto;font-size:13px;border-radius:14px}
.crd{background:var(--w);border:1px solid var(--line);border-radius:20px;box-shadow:0 2px 10px #0B14370a;overflow:hidden}
.h{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scrollbar-width:none}.h::-webkit-scrollbar{display:none}
.search{display:flex;gap:10px;align-items:center;background:var(--w);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--mut);font-size:14px;font-weight:500}
.search input{border:0;outline:0;flex:1;font:500 14px 'Plus Jakarta Sans';background:none;color:var(--navy)}
.chip{flex:none;padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--w);font:600 13px 'Plus Jakarta Sans';cursor:pointer;color:var(--navy);transition:.2s}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
nav{position:absolute;left:0;right:0;bottom:0;background:var(--w);border-top:1px solid var(--line);display:flex;padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 10.5px 'Plus Jakarta Sans';color:var(--mut);cursor:pointer;position:relative}
nav button.on{color:var(--navy)}nav button.on:after{content:"";position:absolute;top:-11px;width:22px;height:3px;border-radius:3px;background:var(--cyan)}
nav button.on i,nav button.on svg{stroke:var(--blue)}
.cta{position:absolute;left:0;right:0;bottom:0;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(#F6F5F000,var(--bg) 30%)}
.ib{width:40px;height:40px;border-radius:14px;background:#ffffffee;border:0;display:grid;place-items:center;color:var(--navy);cursor:pointer}
.fav.on svg{fill:var(--or);stroke:var(--or);animation:pop .4s}
@keyframes pop{50%{transform:scale(1.5)}}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meta div{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600}
.meta i,.meta svg{color:var(--blue)}
.sheet{position:absolute;inset:0;background:#0B143766;display:flex;align-items:flex-end;animation:fd .2s}
.sheet>div{width:100%;background:var(--bg);border-radius:26px 26px 0 0;padding:20px;animation:up .3s}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
.pm{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--w);cursor:pointer;font-weight:600;font-size:14px}.pm.on{border-color:var(--blue);box-shadow:0 0 0 3px #1E6BFF1a}
.ck{width:110px;height:110px;border-radius:50%;background:var(--lime);display:grid;place-items:center;animation:sc .6s cubic-bezier(.3,1.6,.5,1)}
.ck svg{width:54px;height:54px;stroke-width:3.2;stroke-dasharray:60;animation:dr .6s .3s both}
@keyframes sc{from{transform:scale(0)}}@keyframes dr{from{stroke-dashoffset:60}}
.up{position:absolute;inset:0;background:var(--navy);display:flex;flex-direction:column;justify-content:center;padding:30px;color:#fff;z-index:9}
</style></head><body><div class="phone"><div class="app"><div id="v"></div><nav id="n"></nav><div id="sh"></div></div></div>
<script>
const $=s=>document.querySelector(s),R=n=>'Rp'+n.toLocaleString('en-US');
const SP=['Skateboard','Badminton','Basketball','Futsal','Running','Volleyball'],K=s=>s==='Skateboard'?'skate':s.toLowerCase();
const A=[{id:1,t:'Beginner Skate Day',s:'skate',loc:'Skatepark, Surakarta',d:'Sun, 18 Oct 2026',tm:'15:00–17:00',p:25000,tag:'Beginner friendly',sl:'7/10'},
{id:2,t:'Badminton Open Play',s:'badminton',loc:'GOR Manahan',d:'Tonight',tm:'19:00',p:25000,sl:'9/12'},
{id:3,t:'Sunday Running Club',s:'running',loc:'Stadion Manahan',d:'Sun',tm:'06:00',p:0,sl:'18/30'},
{id:4,t:'3v3 Street Hoops',s:'basketball',loc:'Lapangan Kottabarat',d:'Sat',tm:'16:00',p:20000,sl:'5/6'},
{id:5,t:'Futsal Mix Night',s:'futsal',loc:'Solo Futsal Arena',d:'Fri',tm:'20:00',p:30000,sl:'8/10'}];
const S={tab:'home',cat:'All',free:false,fav:{},bk:[],tab2:'Upcoming',cur:null,pm:'GoPay',tx:0,sub:'',sheet:0};
const fee=a=>a.p?Math.round(a.p*.1):0;
const ic=(n,s='')=>`<i data-lucide="${n}" ${s}></i>`;
const ph=(s,x='',st='')=>`<div class="ph ${K(s)}" data-s="${s}" style="${st}">${x}</div>`;
function go(t,c){S.tab=t;if(c!==undefined)S.cur=c;draw()}
function draw(){let t=S.tab,h='';const nav=['home','explore','bookings','community','profile'].includes(t);
h=({home,explore,detail,checkout,success,bookings,community,profile})[t]();
$('#v').outerHTML=`<div id="v">${h}</div>`;
$('#n').style.display=nav?'flex':'none';
$('#n').innerHTML=[['home','Home','house'],['explore','Explore','compass'],['bookings','Bookings','ticket'],['community','Community','users'],['profile','Profile','user']].map(([k,l,i])=>`<button class="${t===k?'on':''}" onclick="go('${k}')">${ic(i,'style="width:22px;height:22px"')}${l}</button>`).join('');
$('#sh').innerHTML=S.sheet?sheet():'';lucide&&lucide.createIcons()}
const card=a=>`<div class="card tap crd" onclick="go('detail',${a.id})" style="flex:none;width:230px">${ph(a.s,'',`height:130px`)}<div style="padding:12px 14px"><h3>${a.t}</h3><div class="cap" style="margin:4px 0 8px">${a.loc}</div><div class="row sb"><span class="cap">${a.d} · ${a.tm.split('–')[0]}</span><b style="font-size:14px">${a.p?R(a.p).replace(',000','K'):'Free'}</b></div></div></div>`;
function home(){const a=A[0];return`<div class="pad" style="padding-top:22px"><div class="row sb"><div><div class="sub">Good morning, Fatikah</div><h2 style="margin-top:4px">Ready to play?</h2></div><div class="row" style="background:var(--w);border:1px solid var(--line);padding:8px 12px;border-radius:99px;font-size:12px;font-weight:700">${ic('map-pin','style="color:var(--or)"')}Surakarta</div><button class="ib crd tap" style="margin-left:6px;position:relative" onclick="go('notif')">${ic('bell')}<span style="position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--or)"></span></button></div>
<div class="search" style="margin:18px 0" onclick="go('search')">${ic('search')}What do you want to play?</div>
<div class="card tap" onclick="go('detail',1)" style="border-radius:22px;overflow:hidden;position:relative;color:#fff">${ph(a.s,'',`height:400px;border-radius:22px`)}<div style="position:absolute;inset:0;background:linear-gradient(#0B143700 35%,#0B1437ee);padding:16px;display:flex;flex-direction:column;justify-content:space-between"><span class="badge" style="align-self:flex-start">Beginner · 3 spots left</span><div><div class="cap" style="color:var(--lime);font-weight:800;letter-spacing:1px">BEGINNER SKATE DAY</div><h1 style="margin:6px 0 12px;font-size:36px">Your first ride<br>starts here.</h1><div class="row" style="font-size:12px;font-weight:600;gap:12px;flex-wrap:wrap;margin-bottom:14px"><span class="row" style="gap:4px">${ic('map-pin')}Skatepark, Surakarta</span><span>Sun, 18 Oct 2026</span><span>15:00–17:00</span><b style="margin-left:auto;font-size:16px">Rp25K</b></div><div class="btn">Join Activity ${ic('arrow-right')}</div></div></div></div></div>
<div style="margin-top:34px"><div class="pad" style="margin-bottom:14px"><h2>What are you into?</h2><div class="sub" style="margin-top:4px">Find something that feels like you.</div></div><div class="h" style="align-items:flex-end">${SP.map((s,i)=>`<div class="card tap" onclick="S.cat='${s}';go('explore')" style="flex:none;width:${i%2?120:148}px">${ph(s,'',`height:${i%2?150:190}px;border-radius:20px`)}<div style="margin-top:8px;font-weight:700;font-size:14px">${s}</div></div>`).join('')}</div></div>
<div style="margin-top:34px"><div class="pad row sb" style="margin-bottom:14px"><div><h2>Playing near you</h2><div class="row sub" style="margin-top:4px;gap:4px">${ic('map-pin')}Surakarta</div></div></div><div class="h">${A.slice(1,4).map(card).join('')}</div></div>
<div class="pad" style="margin-top:34px"><div style="background:var(--navy);color:#fff;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden"><div style="position:absolute;width:180px;height:180px;border-radius:50%;background:var(--vi);right:-60px;top:-60px;opacity:.9"></div><div style="position:relative"><h2 style="font-size:28px">Find your<br>people.</h2><div style="font-size:13px;opacity:.75;margin:6px 0 18px">Good games are better with good people.</div>
<div class="row" style="gap:10px">${[['Skateboard Solo','245','skate'],['Solo Runners','530','running']].map(([n,m,s],i)=>`<div class="tap" onclick="go('community')" style="flex:1;margin-top:${i*18}px">${ph(s,'',`height:110px;border-radius:16px`)}<div style="font-weight:700;font-size:13px;margin-top:8px">${n}</div><div style="font-size:11px;opacity:.7">${m} members</div></div>`).join('')}</div></div></div></div>`}
function explore(){let l=A.filter(a=>(S.cat==='All'||K(S.cat)===a.s)&&(!S.free||a.p===0)&&(!S.beg||a.tag)&&(!S.u25||a.p<=25000)&&a.t.toLowerCase().includes(S.sub));
return`<div class="pad" style="padding-top:24px"><h1>Explore</h1><div class="sub" style="margin:6px 0 18px">Find something worth playing.</div><div class="row"><label class="search" style="flex:1">${ic('search')}<input placeholder="Search activities" value="${S.sub}" oninput="S.sub=this.value.toLowerCase();draw();document.querySelector('.search input').focus()"></label><button class="ib tap" style="background:var(--navy);color:#fff;width:auto;padding:0 14px;gap:6px;height:48px;border-radius:16px;font:700 13px 'Plus Jakarta Sans'" onclick="S.sheet=1;draw()">${ic('sliders-horizontal')}Filter</button></div></div>
<div class="h" style="margin:16px 0 20px">${['All',...SP.slice(0,5)].map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="S.cat='${c}';draw()">${c}</button>`).join('')}</div>
<div class="pad" style="display:flex;flex-direction:column;gap:16px">${l.map((a,i)=>i%3===1?`<div class="card tap crd" onclick="go('detail',${a.id})">${ph(a.s,'',`height:170px`)}<div style="padding:14px" class="row sb"><div><h3>${a.t}</h3><div class="cap" style="margin-top:4px">${a.loc} · ${a.d} · ${a.tm.split('–')[0]}</div></div><b>${a.p?R(a.p).replace(',000','K'):'Free'}</b></div></div>`:`<div class="card tap crd row" onclick="go('detail',${a.id})" style="gap:0;align-items:stretch">${ph(a.s,'',`width:40%;min-height:130px;flex:none`)}<div style="padding:14px;flex:1;display:flex;flex-direction:column;justify-content:space-between">${a.tag?`<span class="badge" style="align-self:flex-start;font-size:9px">${a.tag}</span>`:`<span class="cap" style="font-weight:700;color:var(--blue)">${a.sl} spots</span>`}<div><h3>${a.t}</h3><div class="cap" style="margin-top:4px">${a.loc}<br>${a.d} · ${a.tm.split('–')[0]}</div></div><b>${a.p?R(a.p).replace(',000','K'):'Free'}</b></div></div>`).join('')||'<div class="sub" style="padding:40px 0;text-align:center">No activities match yet.</div>'}</div>`}
function sheet(){return`<div class="sheet" onclick="if(event.target===this){S.sheet=0;draw()}"><div><h2 style="margin-bottom:16px">Filter</h2><div class="pm ${S.free?'on':''}" onclick="S.free=!S.free;draw()">${ic('tag')}Free activities only</div><button class="btn dk" style="margin-top:16px" onclick="S.sheet=0;draw()">Show results</button></div></div>`}
function detail(){const a=A.find(x=>x.id===S.cur),b=a.s==='skate'?['Basic stance','Balance','Pushing','Stopping','Safe falling','Riding confidence']:['Warm-up','Friendly games','Meet new people','Cool-down'];
return`<div style="position:relative">${ph(a.s,'',`height:340px`)}<div class="row sb" style="position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:16px"><button class="ib tap" onclick="go('home')">${ic('arrow-left')}</button><button class="ib tap fav ${S.fav[a.id]?'on':''}" onclick="S.fav[${a.id}]=!S.fav[${a.id}];draw()">${ic('heart')}</button></div></div>
<div style="margin-top:-28px;position:relative;background:var(--bg);border-radius:28px 28px 0 0;padding:24px 20px 0"><span class="badge">${a.tag||'Open to all'}</span><h1 style="margin:12px 0 6px">${a.t.replace(/ (Day|Play|Club|Hoops|Night)$/,'<br>$1')}</h1><div class="sub">${a.s==='skate'?'Your first ride starts here.':'Show up, play, meet people.'}</div>
<div class="meta crd" style="padding:16px;margin:18px 0">${[['map-pin',a.loc],['calendar',a.d],['clock',a.tm],['users',a.sl+' spots']].map(([i,t])=>`<div>${ic(i)}${t}</div>`).join('')}</div>
<h2>${a.s==='skate'?'Learn the basics.':'What to expect.'}</h2><div class="sub" style="margin:6px 0 12px">${a.s==='skate'?"A fun, beginner-friendly session for people trying skateboarding for the first time.":'Relaxed sessions, all levels welcome.'}</div>
<div style="display:flex;flex-wrap:wrap;gap:8px">${b.map(x=>`<span class="row" style="background:var(--w);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600">${ic('check','style="color:var(--blue)"')}${x}</span>`).join('')}</div>
<div class="crd row" style="margin:22px 0;padding:12px;gap:14px"><div class="ph people" style="width:64px;height:64px;border-radius:16px;flex:none"></div><div><h3>Raka Pratama</h3><div class="cap">${SP.includes(a.s)?'':''}${a.s==='skate'?'Skate Coach · 6 yrs':'Host'} · <b style="color:var(--navy)">★ 4.9</b></div><div style="font-size:12px;margin-top:4px;font-weight:500">“Helping beginners enjoy their first ride.”</div></div></div>
<div class="crd" style="padding:16px;margin-bottom:20px">${prc(a)}${a.p?`<div class="cap" style="margin-top:10px;color:var(--blue);font-weight:600">Skatepark entry is free.</div>`:''}</div></div>
<div class="cta"><button class="btn" onclick="go('booking')">Join Activity · ${R((a.p+fee(a))*S.n)}</button></div>`}
const prc=a=>`<div style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500"><div class="row sb"><span>Activity fee</span><span>${R(a.p*S.n)}</span></div><div class="row sb"><span>Sportyfy service fee</span><span>${R(fee(a)*S.n)}</span></div><div class="row sb" style="border-top:1px dashed var(--line);padding-top:10px;font-weight:800;font-size:16px"><span>Total</span><span>${R((a.p+fee(a))*S.n)}</span></div></div>`;
function checkout(){const a=A.find(x=>x.id===S.cur);return`<div class="pad" style="padding-top:20px"><div class="row" style="gap:12px;margin-bottom:20px"><button class="ib tap crd" onclick="go('detail')">${ic('arrow-left')}</button></div><h1>Confirm<br>your spot</h1>
<div class="crd row" style="margin:20px 0;gap:0">${ph(a.s,'',`width:34%;height:110px;flex:none`)}<div style="padding:14px"><h3>${a.t}</h3><div class="cap" style="margin-top:6px;line-height:1.7">${a.d} · ${a.tm}<br>${a.loc}</div></div></div>
<h3 style="margin-bottom:10px">Payment method</h3><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">${[['GoPay','wallet'],['QRIS','qr-code'],['Bank transfer','landmark']].map(([n,i])=>`<div class="pm ${S.pm===n?'on':''}" onclick="S.pm='${n}';draw()">${ic(i)}${n}</div>`).join('')}</div><div class="crd" style="padding:16px">${prc(a)}</div></div>
<div class="cta"><button class="btn dk" onclick="pay()">Pay ${R((a.p+fee(a))*S.n)}</button></div>`}
function pay(){const a=A.find(x=>x.id===S.cur);S.tx++;S.bk.unshift({...a,id2:'SPY-'+String(S.tx).padStart(3,'0'),paid:(a.p+fee(a))*S.n,fee:fee(a)*S.n});go('success')}
function success(){const b=S.bk[0];return`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;position:relative;overflow:hidden"><div style="position:absolute;width:300px;height:300px;border-radius:50%;background:var(--vi);opacity:.15;top:-80px;right:-100px"></div><div class="ck">${ic('check')}</div><h1 style="font-size:42px;margin:26px 0 10px">You're in!</h1><div class="sub" style="max-width:250px;font-size:14px">Your spot for ${b.t} is confirmed.</div><div class="crd" style="margin:22px 0 28px;padding:12px 24px"><div class="cap">Booking ID</div><b style="font-size:20px;letter-spacing:1px">${b.id2}</b></div><button class="btn dk" onclick="S.tab2='Upcoming';go('bookings')">View My Booking</button><button class="btn ol" style="margin-top:10px" onclick="go('explore')">Explore More Activities</button></div>`}
function bookings(){const up=S.tab2==='Upcoming';const done=[A[2],A[1]];
return`<div class="pad" style="padding-top:24px"><h1>Your bookings</h1><div class="row" style="margin:18px 0;gap:8px">${['Upcoming','Completed'].map(t=>`<button class="chip ${S.tab2===t?'on':''}" onclick="S.tab2='${t}';draw()">${t}</button>`).join('')}</div>
<div style="display:flex;flex-direction:column;gap:16px">${(up?S.bk:done).map(a=>`<div class="crd">${ph(a.s,'',`height:150px`)}<div style="padding:14px"><div class="row sb"><h3>${a.t}</h3><span class="badge" style="background:${up?'var(--lime)':'var(--line)'}">${up?'Confirmed':'Done'}</span></div><div class="cap" style="margin:6px 0 12px">${a.d} · ${a.tm}<br>${a.loc}${a.id2?' · '+a.id2:''}</div><button class="btn dk sm" onclick="go('detail',${a.id})">View Details</button></div></div>`).join('')||`<div class="sub" style="text-align:center;padding:50px 0">No upcoming bookings.<br>Your next game is one tap away.</div>`}</div></div>`}

function cdetail(){const c=C[S.cur],u=A.filter(a=>a.s===c[1]);if(!u.length)u.push(A[0]);return`<div style="position:relative">${ph(c[1],'',`height:260px`)}<div style="position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px">${bk('community')}</div></div><div style="margin-top:-26px;position:relative;background:var(--bg);border-radius:26px 26px 0 0;padding:22px 20px 0"><span class="badge" style="background:var(--vi);color:#fff">${c[3]} members</span><h1 style="margin:10px 0 6px;font-size:30px">${c[0]}</h1><div class="row sub" style="gap:4px">${ic('map-pin')}${c[2]}</div><div style="font-size:14px;margin:14px 0 20px;line-height:1.5;font-weight:500">A friendly group for people who want to play more and meet new people. Beginners welcome, no experience needed.</div><button class="btn ol" onclick="this.textContent='Joined community'">Join Community</button><h2 style="font-size:20px;margin:24px 0 12px">Upcoming activities</h2><div style="display:flex;flex-direction:column;gap:10px">${u.map(a=>`<div class="crd row tap" onclick="go('detail',${a.id})" style="padding:10px;gap:12px"><div class="ph ${a.s}" style="width:56px;height:56px;border-radius:14px;flex:none"></div><div style="flex:1"><h3 style="font-size:14px">${a.t}</h3><div class="cap">${a.d} · ${a.tm.split('–')[0]}</div></div><b style="font-size:13px">${a.p?R(a.p):'Free'}</b></div>`).join('')}</div></div><div class="cta"><button class="btn" onclick="go('detail',${u[0].id})">Join an activity</button></div>`}
function notif(){const n=[['ticket','Booking confirmed','Beginner Skate Day · Sun, 18 Oct','2m','var(--lime)'],['flame','Spots filling fast','Badminton Open Play has 3 spots left','1h','var(--or)'],['users','New in Skateboard Solo','A beginner session was just posted','3h','var(--vi)'],['wallet','Payment received','Rp27,500 · SPY-001','1d','var(--cyan)']];return`<div class="pad" style="padding-top:20px">${bk('home')}<h1 style="margin:20px 0">Notifications</h1><div style="display:flex;flex-direction:column;gap:10px">${n.map(x=>`<div class="crd row" style="padding:14px;gap:12px;align-items:flex-start"><div style="width:38px;height:38px;border-radius:12px;background:${x[4]};display:grid;place-items:center;flex:none">${ic(x[0])}</div><div style="flex:1"><h3 style="font-size:14px">${x[1]}</h3><div class="cap" style="margin-top:2px">${x[2]}</div></div><span class="cap">${x[3]}</span></div>`).join('')}</div></div>`}

function sheet(){const t=(k,l,i)=>`<div class="pm ${S[k]?'on':''}" style="margin-bottom:8px" onclick="S.${k}=!S.${k};draw()">${ic(i)}${l}</div>`;return`<div class="sheet" onclick="if(event.target===this){S.sheet=0;draw()}"><div><h2 style="margin-bottom:6px">Filter</h2><div class="sub" style="margin-bottom:14px">Surakarta · any date</div>${t('free','Free activities','tag')}${t('beg','Beginner friendly','sprout')}${t('u25','Up to Rp25,000','wallet')}<button class="btn dk" style="margin-top:8px" onclick="S.sheet=0;draw()">Show results</button></div></div>`}
